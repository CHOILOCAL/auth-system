<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA 라우팅: 모든 404를 index.html로 리다이렉트
      var path = window.location.pathname.replace(/^\/auth-system/, '');
      window.location.replace('/auth-system/index.html?p=' + path);
    </script>
  </head>
  <body>
  </body>
</html>
