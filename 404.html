<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureAuth</title>
    <script>
      // GitHub Pages SPA 라우팅 처리
      // 모든 404 요청을 index.html로 리다이렉트하면서 원래 경로 보존
      (function() {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/auth-system/index.html?redirect=' +
          l.pathname.replace(/\/$/, '') + (l.search || '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
