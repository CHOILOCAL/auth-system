<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA 라우팅: 모든 404를 index.html로 리다이렉트
      // /auth-system/login → /auth-system/index.html?redirect=/login
      var l = window.location;
      var pathname = l.pathname.replace(/^\/auth-system/, '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/auth-system/index.html?redirect=' +
        encodeURIComponent(pathname) + (l.search || '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
